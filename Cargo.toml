[package]
name = "jlog"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The run log of just recipes: a shell wrapper that logs each line"
readme = "README.md"

[dependencies]
hmac = "0.12"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
